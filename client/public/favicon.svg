<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F0F13" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.35" />
    </linearGradient>

    <!-- Stem Gradient -->
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Top Loop Gradient -->
    <linearGradient id="topLoopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Bottom Loop Gradient -->
    <linearGradient id="bottomLoopGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Dot Gradient -->
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF007F" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" ry="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#shadow)" />

  <!-- Logo Group -->
  <g>
    <!-- Vertical Stem -->
    <rect x="97" y="104" width="44" height="304" rx="22" fill="url(#stemGrad)" />

    <!-- Top Loop -->
    <path d="M 119,126 H 237 C 282,126 312,151 312,191 C 312,231 282,256 237,256 H 119" 
          fill="none" 
          stroke="url(#topLoopGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Bottom Loop -->
    <path d="M 119,256 H 257 C 307,256 337,281 337,321 C 337,361 307,386 257,386 H 119" 
          fill="none" 
          stroke="url(#bottomLoopGrad)" 
          stroke-width="44" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Brand Dot -->
    <circle cx="397" cy="386" r="20" fill="url(#dotGrad)" filter="url(#glow)" />
  </g>
</svg>